<!DOCTYPE html>
<!-- Birdie — HUD overlay for MSFS 2024. GPL-3.0-only.
     The settings panel (v2 "pocket"). One page for three places: the MSFS toolbar (Coherent GT,
     html_ui/InGamePanels/Birdie), Birdie's own settings window (WebView2; tray: Open panel) and, without WebView2, a
     desktop browser. Birdie serves this folder on 127.0.0.1 and the page talks to Birdie.exe over a WebSocket there.
     The /JS and /templates files exist only inside the sim; elsewhere they are skipped. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birdie</title>
  <link rel="stylesheet" href="/SCSS/common.css" />
  <link rel="stylesheet" href="birdie.css" />
  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/dataStorage.js"></script>
  <script type="text/javascript" src="/JS/buttons.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
  <!-- defines icon-button: without it the title bar's close / detach buttons stay empty (11/17, seen in the sim) -->
  <link rel="import" href="/templates/NewPushButton/NewPushButton.html" />
  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
  <script type="text/javascript" src="birdie.js"></script>
</head>
<body class="border-box">
  <ingamepanel-birdie>
    <ingame-ui id="BirdiePanel" panel-id="PANEL_BIRDIE" title="Birdie" class="ingameUiFrame panelInvisible"
               content-fit="false" min-width="40" min-height="40" resize="both">
      <div id="birdie" class="offline">
        <div class="pocket" id="pocket">
          <!-- Birdie's own window only: the top edge moves it, the hairline cross hides it -->
          <div class="grip" id="grip"></div>
          <div class="x" id="x" role="button" tabindex="0"></div>

          <!-- the peek (mouse resting on the tray icon): a narrow card under the wordmark, whose i is dotted with the bird -->
          <div class="peekcard" id="peekcard">
            <svg class="wm rise" viewBox="0 0 150 58" aria-label="Birdie">
              <text id="wm-t" x="75" y="46" text-anchor="middle">B<tspan id="wm-i">ı</tspan>rdie</text>
              <g id="wm-dot" transform="translate(52.5 20)"><g class="wb"><circle r="3.6"/><path d="M-3.6 0H-11M3.6 0H11M0 -3.6V-8.5"/></g></g>
            </svg>
            <div class="pk-hair"></div>
            <div class="pk-voice serif rise" id="pk-voice"></div>
            <div class="pk-fact rise" id="pk-fact"></div>
            <div class="pk-sw rise"><span id="t-pk"></span>
              <div class="knob" id="pk-power" role="button" tabindex="0">
                <svg viewBox="0 0 34 34"><circle class="halo" cx="17" cy="17" r="16"/><circle class="ring" cx="17" cy="17" r="16"/><circle class="core" cx="17" cy="17" r="6.7"/></svg>
              </div>
            </div>
          </div>

          <!-- preview: the HUD as set now, only while the real one is not on the screen -->
          <div class="pvwrap" id="pvwrap"><div class="pv" id="pv">
            <div class="sun"></div>
            <svg viewBox="20 60 1240 830" preserveAspectRatio="xMidYMid meet">
              <rect class="pvtint" id="pvtint" x="0" y="0" width="1280" height="1024" opacity="0"/>
              <g class="lights" id="lights"></g>
              <g class="hud" id="hud"></g>
            </svg>
            <div class="pvl"><span id="pv-l"></span><span id="pv-r"></span></div>
          </div></div>

          <!-- the pages scroll here, under the preview, which stays put (11/26) -->
          <div class="scroll" id="scroll">
          <div class="panel" id="panel" data-p="0">
            <div class="pages">
              <!-- home: what you touch in flight -->
              <div class="page p0" id="page0">
                <div class="head drag rise" id="head">
                  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g class="b" fill="none" stroke-width="3.8" stroke-linecap="round"><circle cx="32" cy="36" r="10"/><path d="M22 36H5M42 36h17M32 26V12"/></g></svg>
                  <div class="voice serif" id="voice"></div>
                  <div class="knob" id="power" role="button" tabindex="0" aria-pressed="true">
                    <svg viewBox="0 0 34 34"><circle class="halo" cx="17" cy="17" r="16"/><circle class="ring" cx="17" cy="17" r="16"/><circle class="core" cx="17" cy="17" r="6.7"/></svg>
                  </div>
                </div>
                <div class="fact rise" id="fact"></div>
                <!-- first run only (Birdie opens its window with ?welcome): what it needs, the hotkey, the in-sim panel -->
                <div class="welcome" id="welcome">
                  <div class="w-title" id="w-title"></div>
                  <div class="w-line" id="w-cp"></div>
                  <div class="w-line" id="w-win"></div>
                  <div class="w-line" id="w-key"></div>
                  <div class="w-line" id="w-tray"></div>
                  <div class="w-ig" id="w-ig"></div>
                  <div class="w-acts"><span class="act" id="w-install" role="button" tabindex="0"></span><span class="act quiet" id="w-ok" role="button" tabindex="0"></span></div>
                </div>
                <div class="dimmable">
                  <div class="hair"></div>
                  <div class="scale rise" id="s-bright"></div>
                  <div class="scale rise" id="s-size"></div>
                  <div class="scale rise" id="s-glide"></div>
                  <div class="nav first rise" role="button" tabindex="0" data-go="1"><b id="t-sym"></b><span id="n-sym"></span><span class="ar">›</span></div>
                  <div class="nav rise" role="button" tabindex="0" data-go="5"><b id="t-hudlook"></b><span id="n-hudlook"></span><span class="ar">›</span></div>
                  <div class="nav rise" role="button" tabindex="0" data-go="10"><b id="t-terrain"></b><span id="n-terrain"></span><span class="ar">›</span></div>
                  <div class="nav rise" role="button" tabindex="0" data-go="2"><b id="t-fine"></b><span id="n-fine"></span><span class="ar">›</span></div>
                </div>
                <div class="foot rise">
                  <span class="pick" id="lang-zh" role="button" tabindex="0">中文</span>
                  <span class="pick" id="lang-en" role="button" tabindex="0">EN</span>
                  <span class="act plain r" id="t-quit" role="button" tabindex="0"></span>
                </div>
              </div>

              <!-- symbols -->
              <div class="page p1" id="page1">
                <div class="back" role="button" tabindex="0" data-go="0">‹<span class="serif" id="t-sym2"></span></div>
                <div class="dimmable">
                  <div class="gh"><span id="t-path"></span><i></i></div><div class="gl" id="g-path"></div>
                  <div class="gh"><span id="t-world"></span><i></i></div><div class="gl" id="g-world"></div>
                  <div class="gh"><span id="t-inst"></span><i></i></div><div class="gl" id="g-inst"></div>
                  <div class="gdesc" id="gdesc"></div>
                  <!-- each symbol's own settings under its name: dimmed (still adjustable) while that symbol is off -->
                  <div class="gh sd-gh"><span id="t-symDetail"></span><i></i></div>
                  <div class="sd" data-sym="tdz">
                    <div class="sd-h"><svg viewBox="0 0 34 34" class="sd-i"></svg><span class="sd-n"></span></div>
                    <div class="row"><div class="k" id="t-tdzRule"></div><div class="picks" id="p-tdzRule"></div></div>
                    <div class="row"><div class="k" id="t-tdzStyle"></div><div class="picks" id="p-tdzStyle"></div></div>
                  </div>
                  <div class="sd" data-sym="flare">
                    <div class="sd-h"><svg viewBox="0 0 34 34" class="sd-i"></svg><span class="sd-n"></span></div>
                    <div class="row"><div class="k" id="t-tol"></div><div class="picks" id="p-tol"></div></div>
                    <div class="row"><div class="k" id="t-flareRa"></div><div class="picks" id="p-flareRa"></div></div>
                    <div class="row"><div class="k" id="t-flareHi"></div><div class="picks" id="p-flareHi"></div></div>
                    <div class="row"><div class="k" id="t-flareLo"></div><div class="picks" id="p-flareLo"></div></div>
                    <div class="row"><div class="k" id="t-flareEnd"></div><div class="picks" id="p-flareEnd"></div></div>
                  </div>
                  <div class="sd" data-sym="minor">
                    <div class="sd-h"><svg viewBox="0 0 34 34" class="sd-i"></svg><span class="sd-n"></span></div>
                    <div class="row"><div class="k" id="t-ladder"></div><div class="picks" id="p-ladder"></div></div>
                  </div>
                  <div class="sd" data-sym="bra">
                    <div class="sd-h"><svg viewBox="0 0 34 34" class="sd-i"></svg><span class="sd-n"></span></div>
                    <div class="row"><div class="k" id="t-rah"></div><div class="picks" id="p-rah"></div></div>
                  </div>
                  <!-- not one symbol's: the whole HUD drawn a little ahead -->
                  <div class="gh"><span id="t-overall"></span><i></i></div>
                  <div class="row"><div class="k" id="t-lead"></div><div class="picks" id="p-lead"></div></div>
                </div>
              </div>

              <!-- fine tuning: Birdie itself, not the HUD's drawing -->
              <div class="page p2" id="page2">
                <div class="back" role="button" tabindex="0" data-go="0">‹<span class="serif" id="t-fine2"></span></div>
                <div class="dimmable">
                  <div class="nav inner first-inner" role="button" tabindex="0" data-go="4"><b id="t-autonav"></b><span id="n-auto"></span><span class="ar">›</span></div>
                  <div class="nav inner" role="button" tabindex="0" data-go="9"><b id="t-keys"></b><span id="n-keys"></span><span class="ar">›</span></div>
                  <div class="nav inner" role="button" tabindex="0" data-go="11"><b id="t-camnav"></b><span id="n-cam"></span><span class="ar">›</span></div>
                  <div class="hair"></div>
                  <div class="ra">
                    <div><span id="t-ra"></span><span class="ac" id="ra-ac"></span></div>
                    <div id="ra-note"></div>
                    <div><span class="act" id="ra-btn" role="button" tabindex="0"></span><span class="act quiet" id="ra-clear" role="button" tabindex="0"></span></div>
                  </div>
                  <!-- the in-sim toolbar panel, carried in Birdie.exe (src/app/ingame.h): optional -->
                  <div class="hair"></div>
                  <div class="ra ig" id="ig">
                    <div><span id="t-ig"></span><span class="ac" id="ig-state"></span></div>
                    <div class="ig-note" id="ig-note"></div>
                    <div><span class="act" id="ig-main" role="button" tabindex="0"></span><span class="act quiet" id="ig-open" role="button" tabindex="0"></span><span class="act quiet" id="ig-remove" role="button" tabindex="0"></span></div>
                    <div class="ig-more" id="ig-more"><span class="act plain" id="ig-pick" role="button" tabindex="0"></span><span class="act plain" id="ig-export" role="button" tabindex="0"></span></div>
                  </div>
                  <div class="row look"><div class="k" id="t-look"></div><div class="picks" id="p-look"></div></div>
                  <div class="foot2">
                    <span class="toggle" id="auto" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-auto"></span></span>
                    <span class="act plain" id="t-log" role="button" tabindex="0"></span>
                    <span class="ver num" id="ver"></span>
                  </div>
                </div>
              </div>

              <!-- HUD border: traced on the screen, kept per aircraft and seat -->
              <div class="page p3" id="page3">
                <div class="back" role="button" tabindex="0" data-go="5">‹<span class="serif" id="t-border2"></span></div>
                <div class="dimmable">
                  <div class="bd">
                    <div class="bd-who" id="bd-who"></div>
                    <div class="bd-state" id="bd-state"></div>
                    <div class="bd-go"><span class="act" id="bd-edit" role="button" tabindex="0"></span></div>
                    <div class="bd-note" id="bd-eye"></div>
                    <div class="bd-note" id="bd-cut"><span id="bd-cut-t"></span><span class="act" id="bd-fit" role="button" tabindex="0"></span></div>
                    <div class="bd-more"><span class="act quiet" id="bd-mirror" role="button" tabindex="0"></span><span class="act quiet" id="bd-clear" role="button" tabindex="0"></span></div>
                  </div>
                  <div class="gdesc" id="bd-desc"></div>
                </div>
              </div>

              <!-- the HUD's look: a whole preset, each symbol's drawing, colour and line -->
              <div class="page p5" id="page5">
                <div class="back" role="button" tabindex="0" data-go="0">‹<span class="serif" id="t-hudlook2"></span></div>
                <div class="dimmable">
                  <div class="row"><div class="k" id="t-preset"></div><div class="picks" id="p-preset"></div></div>
                  <div class="nav inner" role="button" tabindex="0" data-go="6"><b id="t-layout"></b><span id="n-layout"></span><span class="ar">›</span></div>
                  <div class="toggle" id="xw" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-xw"></span><span class="hk num" id="xw-hk"></span></div>
                  <div class="nav inner" role="button" tabindex="0" data-go="7"><b id="t-animnav"></b><span id="n-anim"></span><span class="ar">›</span></div>
                  <div class="gh"><span id="t-elements"></span><i></i></div>
                  <div class="row"><div class="k" id="t-fpv"></div><div class="picks" id="p-fpv"></div></div>
                  <div class="row"><div class="k" id="t-spdS"></div><div class="picks" id="p-spdS"></div></div>
                  <div class="row"><div class="k" id="t-altS"></div><div class="picks" id="p-altS"></div></div>
                  <div class="row"><div class="k" id="t-vsS"></div><div class="picks" id="p-vsS"></div></div>
                  <div class="row"><div class="k" id="t-ladderS"></div><div class="picks" id="p-ladderS"></div></div>
                  <div class="row"><div class="k" id="t-hdgS"></div><div class="picks" id="p-hdgS"></div></div>
                  <div class="row"><div class="k" id="t-rollS"></div><div class="picks" id="p-rollS"></div></div>
                  <div class="toggle" id="accel" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-accel"></span></div>
                  <div class="gh"><span id="t-finish"></span><i></i></div>
                  <div class="row"><div class="k" id="t-color"></div><div class="picks swatches" id="p-color"></div></div>
                  <div class="row"><div class="k" id="t-font"></div><div class="picks" id="p-font"></div></div>
                  <div class="scale" id="s-outline"></div>
                  <div class="scale" id="s-glow"></div>
                  <!-- where the HUD is drawn: the border traced on the screen, and the tint that fills it -->
                  <div class="gh"><span id="t-tint"></span><i></i></div>
                  <div class="nav inner" role="button" tabindex="0" data-go="3"><b id="t-border"></b><span id="n-border"></span><span class="ar">›</span></div>
                  <div class="toggle" id="tint-on" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-tintOn"></span></div>
                  <div class="more" id="tint-more">
                    <div class="row"><div class="k" id="t-tintColor"></div><div class="picks swatches" id="p-tintColor"></div></div>
                    <div class="scale" id="s-tintHue"></div>
                    <div class="scale" id="s-tintAlpha"></div>
                    <div class="row"><div class="k" id="t-tintEdge"></div><div class="picks" id="p-tintEdge"></div></div>
                  </div>
                </div>
              </div>

              <!-- layout: where each part sits and how large -->
              <div class="page p6" id="page6">
                <div class="back" role="button" tabindex="0" data-go="5">‹<span class="serif" id="t-layout2"></span></div>
                <div class="dimmable">
                  <div id="lay-list"></div>
                  <div class="lay-reset"><span class="act" id="lay-reset" role="button" tabindex="0"></span></div>
                  <div class="gdesc" id="lay-desc"></div>
                </div>
              </div>

              <!-- the HUD coming and going -->
              <div class="page p7" id="page7">
                <div class="back" role="button" tabindex="0" data-go="5">‹<span class="serif" id="t-animnav2"></span></div>
                <div class="dimmable">
                  <div class="row"><div class="k" id="t-animIn"></div><div class="picks" id="p-animIn"></div></div>
                  <div class="row"><div class="k" id="t-animOut"></div><div class="picks" id="p-animOut"></div></div>
                  <div class="row"><div class="k" id="t-animTime"></div><div class="picks" id="p-animTime"></div></div>
                  <div class="anim-try"><span class="act" id="try-in" role="button" tabindex="0"></span><span class="act quiet" id="try-out" role="button" tabindex="0"></span></div>
                  <div class="gdesc" id="anim-desc"></div>
                </div>
              </div>

              <!-- hotkeys: click a combo, then press the new one -->
              <div class="page p9" id="page9">
                <div class="back" role="button" tabindex="0" data-go="2">‹<span class="serif" id="t-keys2"></span></div>
                <div class="dimmable">
                  <div id="hk-list"></div>
                  <div class="lay-reset"><span class="act" id="hk-reset" role="button" tabindex="0"></span></div>
                  <div class="gdesc" id="hk-desc"></div>
                </div>
              </div>

              <!-- terrain: the green slopes and the skyline (src/terrain), and the data on disk, told plainly -->
              <div class="page p10" id="page10">
                <div class="back" role="button" tabindex="0" data-go="0">‹<span class="serif" id="t-terrain2"></span></div>
                <div class="dimmable">
                  <div class="toggle" id="tr-on" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-trOn"></span></div>
                  <div class="tr-intro" id="tr-intro"></div>
                  <div class="more" id="tr-more">
                    <div class="row"><div class="k" id="t-trLook"></div><div class="picks" id="p-trLook"></div></div>
                    <div class="scale" id="s-trStrength"></div>
                    <!-- its own border: the terrain may reach further than the HUD (the whole windscreen) or stay smaller -->
                    <div class="bd tr-bd">
                      <div><span id="t-trBorder"></span><span class="ac" id="tr-bd-state"></span></div>
                      <div class="tr-acts"><span class="act" id="tr-bd-edit" role="button" tabindex="0"></span><span class="act quiet" id="tr-bd-mirror" role="button" tabindex="0"></span><span class="act quiet" id="tr-bd-clear" role="button" tabindex="0"></span></div>
                      <div class="tr-note" id="tr-bd-note"></div>
                    </div>
                    <div class="toggle" id="tr-stream" role="button" tabindex="0" aria-pressed="true"><span class="dot"></span><span id="t-trStream"></span></div>
                    <div class="tr-note" id="tr-stream-note"></div>
                    <div class="row"><div class="k" id="t-trRes"></div><div class="picks" id="p-trRes"></div></div>
                    <div class="row"><div class="k" id="t-trCap"></div><div class="picks" id="p-trCap"></div></div>
                    <div class="toggle" id="tr-notes" role="button" tabindex="0" aria-pressed="true"><span class="dot"></span><span id="t-trNotes"></span></div>
                  </div>
                  <!-- on disk: always shown, so the space can be given back even with terrain off -->
                  <div class="gh"><span id="t-trDisk"></span><i></i></div>
                  <div class="ra tr">
                    <div class="tr-use" id="tr-use"></div>
                    <div class="tr-path" id="tr-path"></div>
                    <div class="tr-acts" id="tr-dir-acts"><span class="act quiet" id="tr-open" role="button" tabindex="0"></span><span class="act quiet" id="tr-move" role="button" tabindex="0"></span><span class="act plain" id="tr-move-def" role="button" tabindex="0"></span></div>
                    <div class="tr-acts"><span class="act quiet" id="tr-clear" role="button" tabindex="0"></span><span class="act quiet" id="tr-del-all" role="button" tabindex="0"></span></div>
                    <div class="tr-note" id="tr-disk-note"></div>
                  </div>
                  <div class="gh"><span id="t-trPkg"></span><i></i></div>
                  <div class="tr-pkg-desc" id="tr-pkg-desc"></div>
                  <div class="tr-job" id="tr-job"><span id="tr-job-t"></span><span class="act plain" id="tr-stop" role="button" tabindex="0"></span></div>
                  <div id="tr-regions"></div>
                  <div class="tr-imp" id="tr-imp">
                    <div class="tr-note" id="tr-imp-desc"></div>
                    <div class="tr-acts"><span class="act quiet" id="tr-open-import" role="button" tabindex="0"></span><span class="act quiet" id="tr-import" role="button" tabindex="0"></span></div>
                  </div>
                  <div class="gdesc tr-credit" id="tr-credit"></div>
                </div>
              </div>

              <!-- showing and hiding by itself: on the take-off roll, and up high -->
              <!-- camera source: ChasePlane's L-vars or the sim's own Camera API (src/core/camera.h), read only -->
              <div class="page p11" id="page11">
                <div class="back" role="button" tabindex="0" data-go="2">‹<span class="serif" id="t-camnav2"></span></div>
                <div class="dimmable">
                  <div class="row"><div class="k" id="t-cam"></div><div class="picks" id="p-cam"></div></div>
                  <div class="ra">
                    <div><span id="t-camst"></span><span class="ac" id="cam-state"></span></div>
                    <div id="cam-note"></div>
                    <div id="cam-origin"></div>
                    <div><span class="act quiet" id="cam-redo" role="button" tabindex="0"></span></div>
                  </div>
                  <div class="gdesc" id="cam-desc"></div>
                </div>
              </div>

              <div class="page p4" id="page4">
                <div class="back" role="button" tabindex="0" data-go="2">‹<span class="serif" id="t-autonav2"></span></div>
                <div class="dimmable">
                  <div class="toggle" id="as" role="button" tabindex="0" aria-pressed="true"><span class="dot"></span><span id="t-as"></span></div>
                  <div class="more" id="as-more"><div class="picks" id="p-askt"></div></div>
                  <div class="toggle" id="ah" role="button" tabindex="0" aria-pressed="false"><span class="dot"></span><span id="t-ah"></span></div>
                  <div class="more" id="ah-more">
                    <div class="row"><div class="k" id="t-ahft"></div><div class="picks" id="p-ahft"></div></div>
                    <div class="row"><div class="k" id="t-ahs"></div><div class="picks" id="p-ahs"></div></div>
                  </div>
                  <div class="gdesc" id="auto-desc"></div>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      </div>
    </ingame-ui>
  </ingamepanel-birdie>
</body>
</html>
